spring:
  application:
    name: greenify-backend
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/greenify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET:greenify_super_secret_jwt_signing_key_must_be_at_least_32_bytes_long_for_hs256_security_spec_2026}
  access-token-expiration-ms: 900000 # 15 minutes
  refresh-token-expiration-ms: 2592000000 # 30 days

otp:
  test-mode: true
  fixed-code: "123456"
  provider: mock
  expiry-minutes: 5

payout:
  provider: mock
  bkash:
    base-url: ${BKASH_BASE_URL:https://checkout.sandbox.bka.sh/v1.2.0-beta}
    app-key: ${BKASH_APP_KEY:mock_app_key}
    app-secret: ${BKASH_APP_SECRET:mock_app_secret}
    username: ${BKASH_USERNAME:mock_username}
    password: ${BKASH_PASSWORD:mock_password}

economics:
  tokens-per-kg: 100
  tokens-per-taka: 4
  min-withdrawal-taka: 100
  almost-full-threshold-pct: 80
  co2-kg-per-plastic-kg: 1.5
  qr-ttl-seconds: 60

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
