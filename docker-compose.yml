version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: greenify_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: greenify_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenify_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/greenify_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: greenify_super_secret_jwt_signing_key_must_be_at_least_32_bytes_long_for_hs256_security_spec_2026
      OTP_TEST_MODE: "true"
      PAYOUT_PROVIDER: mock
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
